<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
    <meta content="Community Spotlight" property="og:title">
    <meta content="Community Spotlight is a project aimed at providing Free Promotions for Everyone" property="og:description">
    <meta content="https://github.com/Community-Spotlight" property="og:url">
    <meta content="https://community-spotlight.github.io./assets/CS-logo.png" property="og:image">
    <meta content="#00ff62" data-react-helmet="true" name="theme-color">
    <title>Community Spotlight</title>
    <link href="https://fonts.googleapis.com/css?family=Tilt+Warp" rel="stylesheet" type="text/css">
    <link href="./css/main.css" rel="stylesheet" type="text/css">
    <link href="./css/pages.css" rel="stylesheet" type="text/css">
    <link rel="shortcut icon" href="./assets/CS-logo.svg" type="image/x-icon">
  </head>
  <body style="background: #151515">
    <nav class="nav-bar" for="nav">
      <div class="logo" dataset-name="logo">
          <img src="./assets/CS-logo.svg"></img>
          <div style="padding: 0px 5px; margin-right: 5px;">Community Spotlight</div>
      </div>
      <div class="nav-btn" dataset-name="theme-switch">
          <img src="./assets/light.svg"></img>
          <span>Light Mode</span>
      </div>
      <div class="nav-btn" dataset-name="about">
        <img src="./assets/info.svg"></img>
        <span>About Us</span>
      </div>
      <div class="nav-btn" dataset-name="submit">
        <img src="./assets/upload.svg"></img>
        <span>Submit a Promo</span>
      </div>
      <div class="nav-btn" dataset-name="exports">
        <img src="./assets/eye.svg"></img>
        <span>For Developers</span>
      </div>
      <div class="nav-btn" dataset-name="tos">
        <img src="./assets/paper.svg"></img>
        <span>Terms of Service</span>
      </div>
      <div class="nav-btn" dataset-name="team">
        <img src="./assets/team.svg"></img>
        <span>Our Team</span>
      </div>
    </nav>
    <script src="./scripts/startup.js"></script>
  </body>
</html>
