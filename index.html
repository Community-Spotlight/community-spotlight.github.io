<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
    <meta content="Community Spotlight" property="og:title">
    <meta content="Community Spotlight is a project aimed at providing Free Promotions for Everyone" property="og:description">
    <meta content="https://github.com/Community-Spotlight" property="og:url">
    <meta content="https://community-spotlight.github.io/site-real/assets/CS-logo.png" property="og:image">
    <meta content="#00ff62" data-react-helmet="true" name="theme-color">
    <title>Community Spotlight</title>
    <link href="https://fonts.googleapis.com/css?family=Tilt+Warp" rel="stylesheet" type="text/css">
    <link href="/site-real/css/main.css" rel="stylesheet" type="text/css">
    <link href="/site-real/css/pages.css" rel="stylesheet" type="text/css">
    <link rel="shortcut icon" href="/site-real/assets/CS-logo.svg" type="image/x-icon">
  </head>
  <body style="background: #151515">
    <nav class="nav-bar">
      <div class="logo">
          <img src="/site-real/assets/CS-logo.svg"></img>
          <div style="padding: 0px 5px; margin-right: 5px;">Community Spotlight</div>
      </div>
      <div class="nav-btn" id="mode-switch">
          <img src="/site-real/assets/light.svg"></img>
          <span>Light Mode</span>
      </div>
      <div class="nav-btn" id="about">
        <img src="/site-real/assets/info.svg"></img>
        <span>About Us</span>
      </div>
      <div class="nav-btn" id="submit">
        <img src="/site-real/assets/upload.svg"></img>
        <span>Submit a Promo</span>
      </div>
      <div class="nav-btn" id="exports">
        <img src="/site-real/assets/eye.svg"></img>
        <span>For Developers</span>
      </div>
      <div class="nav-btn" id="tos">
        <img src="/site-real/assets/paper.svg"></img>
        <span>Terms of Service</span>
      </div>
      <div class="nav-btn" id="team">
        <img src="/site-real/assets/team.svg"></img>
        <span>Our Team</span>
      </div>
    </nav>
    <script src="/site-real/scripts/startup.js"></script>
  </body>
</html>
